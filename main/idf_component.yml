dependencies:
  idf: ">=6.1"
  espressif/mdns: "^1.14.1"
  espressif/libsodium: "^1.0.21"
  # FireBeetle 2 uses P4 revision 1.x. esp_audio_codec 2.6+ needs P4 v3.0,
  # so the P4 stays on 2.5; the S3 keeps the newest 2.x.
  espressif/esp_audio_codec:
    matches:
      - if: "target == esp32p4"
        version: ">=2.5.0,<2.6.0"
      - if: "target != esp32p4"
        version: "^2.5.0"
  espressif/cjson: "^1.7.19"
  # Wi-Fi of the P4 Gateway through its C6 co-processor (SDIO). ESP-IDF
  # v6.1 has esp_wifi_remote built in, so this is the only extra component.
  espressif/esp_hosted:
    version: "==3.1.0"
    rules:
      - if: "target in [esp32p4]"
  # The AirPlay 2 protocol core and the PTP clock towards Apple, shared with
  # airplay-esp32. Moved to a new tag only after a test.
  ap2_core:
    git: https://github.com/Kristian8606/esp-airplay2-core.git
    path: components/ap2_core
    version: v1.2.0
  apple_clock:
    git: https://github.com/Kristian8606/esp-airplay2-core.git
    path: components/apple_clock
    version: v1.2.0
  # The player's USB drive (CONFIG_GATEWAY_USB_PLAYER_USB): fetched and
  # built only with that option on.
  espressif/usb:
    version: "1.6.1"
    rules:
      - if: "$CONFIG{GATEWAY_USB_PLAYER_USB_COMPONENTS} == True"
  espressif/usb_host_msc:
    version: "1.3.0"
    rules:
      - if: "$CONFIG{GATEWAY_USB_PLAYER_USB_COMPONENTS} == True"
