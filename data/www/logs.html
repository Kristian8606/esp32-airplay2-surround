<!DOCTYPE html><html lang='en'><head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>System Logs</title>
<style>
:root{--bg:#000;--panel:#0f0f10;--line:rgba(255,255,255,.12);--text:#f2f2f4;--muted:#9a9aa2;--accent:#8b5cff;--ok:#49c98a;--warn:#e7b34b;--err:#ff6b6b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px -apple-system,'Helvetica Neue',system-ui,sans-serif;display:flex;flex-direction:column;padding:12px 16px;gap:10px}
a{color:var(--accent);text-decoration:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{font-size:20px;font-weight:600;margin-right:auto}
#state{font-size:12px;color:var(--muted)}
#state.on{color:var(--ok)}
#state.off{color:var(--err)}
button,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:34px}
button{cursor:pointer}
input{flex:1 1 180px;min-width:0}
#log{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.E{color:var(--err)}.W{color:var(--warn)}.hide{display:none}
</style></head><body>
<header>
<h1>System Logs</h1>
<span id='state'>Connecting</span>
<a href='/'>Back</a>
</header>
<header>
<input id='filter' type='search' placeholder='Show only lines containing' aria-label='Filter'>
<button id='pause' type='button'>Pause</button>
<button id='clear' type='button'>Clear</button>
<button id='save' type='button'>Save</button>
</header>
<div id='log' role='log' aria-live='off'></div>
<script>
const MAX_LINES=2000;
const logEl=document.getElementById('log'),stateEl=document.getElementById('state'),filterEl=document.getElementById('filter'),pauseEl=document.getElementById('pause');
let partial='',paused=false,held=[],retry=1000;

function matches(el){const f=filterEl.value.toLowerCase();return !f||el.textContent.toLowerCase().includes(f);}
function addLine(text){
  /* Remove the colour codes ESP-IDF puts around its log lines. */
  const clean=text.replace(/\x1b\[[0-9;]*m/g,'');
  const el=document.createElement('div');
  el.textContent=clean;
  if(/^[EW] \(/.test(clean))el.className=clean[0];
  if(!matches(el))el.classList.add('hide');
  logEl.appendChild(el);
  while(logEl.childElementCount>MAX_LINES)logEl.firstElementChild.remove();
}
function addText(chunk){
  const parts=(partial+chunk).split('\n');
  partial=parts.pop();
  const follow=logEl.scrollTop+logEl.clientHeight>=logEl.scrollHeight-30;
  parts.forEach(addLine);
  if(follow)logEl.scrollTop=logEl.scrollHeight;
}
function setState(text,cls){stateEl.textContent=text;stateEl.className=cls;}
function connect(){
  const scheme=location.protocol==='https:'?'wss://':'ws://';
  const ws=new WebSocket(scheme+location.host+'/ws/logs');
  ws.onopen=()=>{retry=1000;setState('Connected','on');};
  ws.onmessage=e=>{if(paused)held.push(e.data);else addText(e.data);};
  ws.onclose=()=>{setState('Reconnecting','off');setTimeout(connect,retry);retry=Math.min(retry*2,10000);};
  ws.onerror=()=>ws.close();
}
pauseEl.onclick=()=>{
  paused=!paused;
  pauseEl.textContent=paused?'Resume':'Pause';
  if(!paused){held.forEach(addText);held=[];}
};
document.getElementById('clear').onclick=()=>{logEl.textContent='';partial='';held=[];};
document.getElementById('save').onclick=()=>{
  const lines=[...logEl.children].map(el=>el.textContent).join('\n');
  const link=document.createElement('a');
  link.href=URL.createObjectURL(new Blob([lines+'\n'],{type:'text/plain'}));
  link.download='esp32-log-'+new Date().toISOString().replace(/[:.]/g,'-')+'.txt';
  link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href),1000);
};
filterEl.oninput=()=>{for(const el of logEl.children)el.classList.toggle('hide',!matches(el));};
connect();
</script></body></html>
