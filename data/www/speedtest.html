<!DOCTYPE html><html lang='en'><head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>WiFi Speedtest</title>
<style>
:root{--bg:#000;--panel:#0f0f10;--line:rgba(255,255,255,.12);--text:#f2f2f4;--muted:#9a9aa2;--accent:#8b5cff;--ok:#49c98a;--warn:#e7b34b;--err:#ff6b6b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px -apple-system,'Helvetica Neue',system-ui,sans-serif;padding:16px}
main{max-width:640px;margin:0 auto;display:grid;gap:14px}
a{color:var(--accent);text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:22px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{color:var(--muted);font-size:13px}
select,button{font:inherit;color:var(--text);background:#17171a;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
button{cursor:pointer;background:var(--accent);border-color:var(--accent);font-weight:600;margin-left:auto}
button:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:#17171a;border-radius:10px;padding:12px}
.tile span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.tile b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
progress{width:100%;height:6px;accent-color:var(--accent)}
#note{font-size:14px;color:var(--muted)}
#note.ok{color:var(--ok)}#note.warn{color:var(--warn)}#note.err{color:var(--err)}
</style></head><body><main>
<header><h1>WiFi Speedtest</h1><a href='/'>Back</a></header>
<section class='panel'>
<div class='row'>
<label for='size'>Test size</label>
<select id='size'><option value='1048576'>1 MB</option><option value='4194304' selected>4 MB</option><option value='16777216'>16 MB</option></select>
<button id='start' type='button'>Start</button>
</div>
<progress id='bar' max='1' value='0' aria-label='Progress'></progress>
<div class='tiles'>
<div class='tile'><span>Ping (median)</span><b id='ping'>–</b></div>
<div class='tile'><span>Ping (worst)</span><b id='worst'>–</b></div>
<div class='tile'><span>Download</span><b id='down'>–</b></div>
<div class='tile'><span>Upload</span><b id='up'>–</b></div>
</div>
<p id='note' role='status'>Measures the link between this browser and the board. Stop playback first for a clean result.</p>
</section>
</main>
<script>
const PINGS=20,TIMEOUT_MS=60000;
/* A rule of thumb for the message below, not a measured limit. */
const COMFORTABLE_MBPS=6;
const el=id=>document.getElementById(id);
const fresh=()=>'_='+Date.now()+'-'+Math.random();
const mbps=(bytes,ms)=>bytes*8/1000/ms;
function note(text,cls){el('note').textContent=text;el('note').className=cls||'';}
function withTimeout(){const c=new AbortController();const t=setTimeout(()=>c.abort(),TIMEOUT_MS);return {signal:c.signal,done:()=>clearTimeout(t)};}

async function ping(){
  const times=[];
  for(let i=0;i<PINGS;i++){
    const t0=performance.now();
    const r=await fetch('/api/speedtest/ping?'+fresh(),{cache:'no-store'});
    await r.text();
    if(!r.ok)throw new Error('ping '+r.status);
    times.push(performance.now()-t0);
    el('bar').value=(i+1)/PINGS/3;
  }
  times.sort((a,b)=>a-b);
  el('ping').textContent=times[times.length>>1].toFixed(0)+' ms';
  el('worst').textContent=times[times.length-1].toFixed(0)+' ms';
  return times;
}
async function download(bytes){
  const t=withTimeout();
  try{
    const t0=performance.now();
    const r=await fetch('/api/speedtest/download?bytes='+bytes+'&'+fresh(),{cache:'no-store',signal:t.signal});
    if(!r.ok||!r.body)throw new Error('download '+r.status);
    const reader=r.body.getReader();
    let got=0;
    for(;;){
      const {done,value}=await reader.read();
      if(done)break;
      got+=value.length;
      el('bar').value=1/3+got/bytes/3;
      el('down').textContent=mbps(got,performance.now()-t0).toFixed(1)+' Mbit/s';
    }
    if(got<bytes)throw new Error('download ended early');
    const speed=mbps(got,performance.now()-t0);
    el('down').textContent=speed.toFixed(1)+' Mbit/s';
    return speed;
  }finally{t.done();}
}
async function upload(bytes){
  const t=withTimeout();
  try{
    const body=new Uint8Array(bytes);
    for(let i=0;i<bytes;i+=4096)body[i]=i>>12;
    const t0=performance.now();
    const r=await fetch('/api/speedtest/upload',{method:'POST',body,headers:{'Content-Type':'application/octet-stream'},signal:t.signal});
    await r.text();
    if(!r.ok)throw new Error('upload '+r.status);
    const speed=mbps(bytes,performance.now()-t0);
    el('up').textContent=speed.toFixed(1)+' Mbit/s';
    el('bar').value=1;
    return speed;
  }finally{t.done();}
}
el('start').onclick=async()=>{
  const bytes=+el('size').value;
  el('start').disabled=true;
  ['ping','worst','down','up'].forEach(id=>el(id).textContent='–');
  el('bar').value=0;
  try{
    note('Measuring ping');
    await ping();
    note('Measuring download');
    const down=await download(bytes);
    note('Measuring upload');
    const up=await upload(bytes);
    const slowest=Math.min(down,up);
    if(slowest>=COMFORTABLE_MBPS)note('The link has room for a surround stream.','ok');
    else note('This link may cause dropouts: check the signal at this position.','warn');
  }catch(e){
    note('The test stopped: '+e.message,'err');
  }finally{
    el('start').disabled=false;
  }
};
</script></body></html>
